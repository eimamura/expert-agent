[project]
name = "expert-agent"
version = "0.2.0"
description = "Local-first domain expert AI agent MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.49.0",
  "fastapi>=0.115.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.2",
  "sqlglot>=25.0.0",
  "ulid-py>=1.1.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents", "runtime", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
